<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        // Restore the real path after the 404.html redirect (see public/404.html)
        // so React Router mounts on the intended route, not on "/".
        var params = new URLSearchParams(location.search);
        var redirect = params.get("redirect");
        if (redirect) {
          var basePath = "/portfolio-website/";
          history.replaceState(null, "", basePath + redirect);
        }
      })();
    </script>
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var theme =
          stored ||
          (window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark");
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Anish Dandekar — Sr. Software Engineer / Sr. Full Stack Engineer specializing in AI-driven development and scalable full-stack solutions."
    />
    <title>Anish Dandekar — Software Engineer</title>

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://anish0714.github.io/portfolio-website/" />
